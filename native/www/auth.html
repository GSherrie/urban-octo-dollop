<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SherPay — signing in…</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#F4F7FB;color:#0F1B2D;min-height:100vh;display:grid;place-items:center;margin:0}
  .box{background:#fff;border-radius:18px;box-shadow:0 24px 64px -24px rgba(4,28,58,.35);padding:32px 30px;text-align:center;max-width:360px}
  img{width:44px;height:44px;border-radius:11px;margin-bottom:12px}
  h2{font-size:18px;letter-spacing:-.2px;margin:0 0 6px}
  p{font-size:13px;color:#5B6B7F;margin:0;line-height:1.5}
  .spin{width:26px;height:26px;border:3px solid #E3EAF3;border-top-color:#0A6BDC;border-radius:50%;margin:0 auto 14px;animation:s .8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
  <img src="assets/logo.png" alt="SherPay">
  <div class="spin" id="sp"></div>
  <h2 id="t">Signing you in…</h2>
  <p id="m">One moment.</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(async function () {
  var $ = function (id) { return document.getElementById(id); };
  try {
    var cfg = null;
    try { cfg = JSON.parse(localStorage.getItem('sherpay_db_v1') || 'null'); } catch (e) {}
    var c = cfg && cfg.settings && cfg.settings.cloud;
    if (!c || !c.enabled || !c.url || !c.anonKey) throw new Error('Cloud sync is not configured on this device. Open the app, enable it in Settings, then use this link again.');
    /* detectSessionInUrl (default on) exchanges the email-link token here;
       the session persists to localStorage and is picked up by the main app. */
    var client = window.supabase.createClient(c.url, c.anonKey);
    await new Promise(function (r) { setTimeout(r, 800); });
    var res = await client.auth.getSession();
    var session = res && res.data && res.data.session;
    if (!session) throw new Error('This sign-in link has expired or was already used — request a new one from the app.');
    $('sp').style.display = 'none';
    $('t').textContent = 'Signed in';
    $('m').textContent = 'Opening SherPay…';
    setTimeout(function () { location.replace('index.html'); }, 500);
  } catch (e) {
    $('sp').style.display = 'none';
    $('t').textContent = 'Sign-in problem';
    $('m').textContent = (e && e.message) || 'Something went wrong.';
  }
})();
</script>
</body>
</html>
