<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#06244B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SherPay">
<title>SherPay — Invoicing, Receipts & Payments</title>
<meta name="description" content="SherPay: create branded invoices, get paid online, scan receipts with OCR, track expenses and export tax-ready reports — from any device.">
<meta property="og:title" content="SherPay — Invoicing, Receipts & Payments">
<meta property="og:description" content="Create branded invoices, get paid online, scan receipts with OCR and export tax-ready reports.">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/icon-512.png">
<meta name="twitter:card" content="summary">
<noscript><div style="padding:40px;text-align:center;font-family:sans-serif">SherPay needs JavaScript enabled to run.</div></noscript>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css?v=16">
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="splash-inner">
    <div class="splash-logo-wrap">
      <div class="splash-ring"></div>
      <img src="assets/logo.png" alt="SherPay logo" class="splash-logo">
    </div>
    <div class="splash-word">Sher<span>Pay</span></div>
    <div class="splash-tag">Invoices · Receipts · Payments</div>
    <div class="splash-bar"><span></span></div>
  </div>
</div>
<div id="app" class="shell-loading"></div>
<div id="modal-root"></div>
<div id="toast-root" role="status" aria-live="polite"></div>
<script src="js/store.js?v=16"></script>
<script src="js/ui.js?v=16"></script>
<script src="js/views-auth.js?v=16"></script>
<script src="js/views-main.js?v=16"></script>
<script src="js/views-editor.js?v=16"></script>
<script src="js/views-ops.js?v=16"></script>
<script src="js/views-biz.js?v=16"></script>
<script src="js/views-account.js?v=16"></script>
<script>
  window.addEventListener('DOMContentLoaded', function () {
    Store.boot();
    /* cloud init restores any existing session before the shell renders */
    Promise.resolve(Store.cloud && Store.cloud.enabled() ? Store.cloud.init() : null).catch(function () {}).then(function () {
      UI.start();
      UI.dismissSplash();
      /* pick up any payments that completed via hosted checkout since last open */
      Store.syncPayments().then(function (n) { if (n) UI.toast(n + ' payment' + (n === 1 ? '' : 's') + ' received online', 'green', 'wallet'); }).catch(function () {});
      /* keep the workspace current: re-sync whenever the app returns to the foreground */
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible' && Store.cloud && Store.cloud.enabled()) {
          Store.cloud.sync().then(function (r) { if (r && r.action === 'pulled') UI.render(true); }).catch(function () {});
        }
      });
    });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        /* Registered under a versioned URL (?v=N) with updateViaCache:'none' so a phone/PWA
           always checks for the newest build instead of trusting its HTTP cache. A new worker
           skipWaiting()s on install; the one-time controllerchange reload then swaps the running
           page onto fresh assets, so an installed app never keeps serving an old build. */
        navigator.serviceWorker.register('sw.js?v=16', { updateViaCache: 'none' }).then(function (reg) {
          reg.update().catch(function () {});
          document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible') reg.update().catch(function () {});
          });
        }).catch(function () {});
        var swapped = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (swapped) return;
          swapped = true;
          location.reload();
        });
      });
    }
  });
</script>
</body>
</html>
