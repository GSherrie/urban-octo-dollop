<link rel="stylesheet" href="styles.css?v=22">
<script>
  /* Paint the saved theme (light | dark | system) before first paint, so a dark-mode
     launch never flashes white behind the splash. Same preference the Account ▸
     Preferences chips write (db.settings.preferences.theme); ui.js re-applies it on
     start() and keeps it in step with the OS while "system" is selected. */
  (function () {
    try {
      // per-user theme: never read the legacy shared workspace here — a
      // signed-out boot must not resurrect another account's data. Scan only
      // sherpay_db_v1:<userId> caches for a dark preference.
      var dark = false;
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (!k || k.indexOf('sherpay_db_v1:') !== 0) continue;
        try {
          var t = (((JSON.parse(localStorage.getItem(k)).settings || {}).preferences || {}).theme || 'system');
          if (t === 'dark' || (t !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) { dark = true; break; }
        } catch (e) {}
      }
      if (dark) {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.addEventListener('DOMContentLoaded', function () {
          var mc = document.querySelector('meta[name="theme-color"]');
          if (mc) mc.setAttribute('content', '#0B1220');
        });
      }
    } catch (e) { /* private mode / corrupt store — stay in light */ }
  })();
</script>
</head>
<body>
<div id="app" class="shell-loading"></div>
<div id="modal-root"></div>
<div id="toast-root" role="status" aria-live="polite"></div>
<script src="js/store.js?v=22"></script>
<script src="js/ui.js?v=22"></script>
<script src="js/views-auth.js?v=22"></script>
<script src="js/views-main.js?v=22"></script>
  <script src="js/views-inventory.js?v=22"></script>
<script src="js/views-editor.js?v=22"></script>
<script src="js/views-ops.js?v=22"></script>
<script src="js/views-biz.js?v=22"></script>
<script src="js/views-account.js?v=22"></script>
<script>
  window.addEventListener('DOMContentLoaded', function () {
    Store.boot();
    UI.start();
    UI.dismissSplash();
    /* pick up any payments that completed via hosted checkout since last open */
    Store.syncPayments().then(function (n) { if (n) UI.toast(n + ' payment' + (n === 1 ? '' : 's') + ' received online', 'green', 'wallet'); }).catch(function () {});
    /* and any SherPay Pro upgrade paid by mobile money whose reference has
       cleared since this device last looked */
    /* keep the workspace current: re-sync whenever the app returns to the foreground */
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && Store.cloud && Store.cloud.enabled()) {
        Store.cloud.sync().then(function (r) { if (r && r.action === 'pulled') UI.render(true); }).catch(function () {});
      }
    });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        /* Registered under a versioned URL (?v=N) with updateViaCache:'none' so a phone/PWA
           always checks for the newest build instead of trusting its HTTP cache. A new worker
           skipWaiting()s on install; the one-time controllerchange reload then swaps the running
           page onto fresh assets, so an installed app never keeps serving an old build. */
        navigator.serviceWorker.register('sw.js?v=22', { updateViaCache: 'none' }).then(function (reg) {
          reg.update().catch(function () {});
          document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible') reg.update().catch(function () {});
          });
        }).catch(function () {});
        var swapped = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (swapped) return;
          swapped = true;
          location.reload();
        });
      });
    }
  });
</script>
</body>
</html>
