<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#06244B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SherPay">
<title>SherPay — Invoicing, Receipts & Payments</title>
<meta name="description" content="SherPay: create branded invoices, get paid online, scan receipts with OCR, track expenses and export tax-ready reports — from any device.">
<meta property="og:title" content="SherPay — Invoicing, Receipts & Payments">
<meta property="og:description" content="Create branded invoices, get paid online, scan receipts with OCR and export tax-ready reports.">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/icon-512.png">
<meta name="twitter:card" content="summary">
<noscript><div style="padding:40px;text-align:center;font-family:sans-serif">SherPay needs JavaScript enabled to run.</div></noscript>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css?v=10">
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="splash-inner">
    <div class="splash-logo-wrap">
      <div class="splash-ring"></div>
      <img src="assets/logo.png" alt="SherPay logo" class="splash-logo">
    </div>
    <div class="splash-word">Sher<span>Pay</span></div>
    <div class="splash-tag">Invoices · Receipts · Payments</div>
    <div class="splash-bar"><span></span></div>
  </div>
</div>
<div id="app" class="shell-loading"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script src="js/store.js?v=10"></script>
<script src="js/ui.js?v=10"></script>
<script src="js/views-auth.js?v=10"></script>
<script src="js/views-main.js?v=10"></script>
<script src="js/views-editor.js?v=10"></script>
<script src="js/views-ops.js?v=10"></script>
<script src="js/views-biz.js?v=10"></script>
<script src="js/views-account.js?v=10"></script>
<script>
  window.addEventListener('DOMContentLoaded', function () {
    Store.boot();
    UI.start();
    UI.dismissSplash();
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  });
</script>
</body>
</html>
