<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pay invoice — SherPay</title>
<style>
  :root{--navy:#06244B;--blue:#0A6BDC;--green:#0E8059;--ink:#0F1B2D;--muted:#5B6B7F;--line:#E3EAF3;--bg:#F4F7FB}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:#fff;border-radius:18px;box-shadow:0 24px 64px -24px rgba(4,28,58,.35);max-width:430px;width:100%;padding:28px}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .brand img{width:34px;height:34px;border-radius:9px}
  .brand b{font-size:17px;letter-spacing:-.2px}
  .num{font-size:13px;color:var(--muted)}
  h1{font-size:28px;letter-spacing:-.5px;margin:2px 0 16px}
  .rows{border-top:1px solid var(--line);margin-bottom:18px}
  .row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .row span{color:var(--muted)}
  .row.grand b{font-size:17px;color:var(--green)}
  .items .row span{color:var(--ink)}
  .badge{display:inline-block;background:#E4FAF1;color:#0E8059;border-radius:99px;padding:3px 10px;font-size:11.5px;font-weight:700;margin-left:8px;vertical-align:middle}
  button{width:100%;padding:13px;border:none;border-radius:11px;background:var(--green);color:#fff;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
  button:disabled{opacity:.55;cursor:default}
  .err{background:#FDECEC;color:#B21E22;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px;display:none}
  .note{font-size:11.5px;color:var(--muted);text-align:center;margin-top:12px}
  .powered{font-size:11px;color:var(--muted);text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><img src="assets/logo.png" alt="SherPay"><b>SherPay</b><span class="badge" id="badge" hidden>Paid</span></div>
  <div class="num" id="num">Loading…</div>
  <h1 id="amt">—</h1>
  <div class="err" id="err"></div>
  <div class="rows" id="rows" hidden>
    <div class="items" id="items"></div>
    <div class="row"><span>Issued by</span><b id="biz">—</b></div>
    <div class="row"><span>Due date</span><b id="due">—</b></div>
    <div class="row grand"><span>Amount due</span><b id="total">—</b></div>
  </div>
  <button id="paybtn" disabled>Loading…</button>
  <div class="note">Secured by Paystack · cards, bank transfer &amp; mobile money</div>
  <div class="powered">Powered by <b>SherPay</b></div>
</div>
<script src="https://js.paystack.co/v2/inline.js"></script>
<script src="js/pay.js?v=16"></script>
</body>
</html>
